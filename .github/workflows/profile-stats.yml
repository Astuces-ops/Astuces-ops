name: Profile stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer stats.svg, top-langs.svg et activity.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          # METRICS_TOKEN (PAT) est optionnel : il permet de compter aussi les dépôts privés
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_DIR: profile
        run: python scripts/generate_stats.py

      - name: Commit des cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || (git commit -m "chore: mise à jour des cartes du profil [skip ci]" && git push)
