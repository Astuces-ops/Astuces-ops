<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Issa Ibrahim Moubarak, AI Engineer, Data Scientist, DevOps et MLOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.65" stop-color="#16243a"/>
      <stop offset="1" stop-color="#1F4E79"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- Réseau de noeuds : pipelines de données et modèles -->
    <g stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.2" fill="none">
      <path id="l1" d="M760 70 L880 40 L1010 90 L1130 55"/>
      <path id="l2" d="M760 70 L850 150 L990 190 L1130 150"/>
      <path d="M880 40 L850 150"/>
      <path d="M1010 90 L990 190"/>
      <path d="M1010 90 L1130 150"/>
      <path d="M880 40 L990 190"/>
      <path d="M1130 55 L1130 150"/>
      <path d="M850 150 L760 215"/>
      <path d="M990 190 L1080 235"/>
    </g>
    <g fill="#58A6FF">
      <circle cx="760" cy="70" r="5"/>
      <circle cx="880" cy="40" r="4"/>
      <circle cx="1010" cy="90" r="6" fill="#8A2BE2"/>
      <circle cx="1130" cy="55" r="4"/>
      <circle cx="850" cy="150" r="6"/>
      <circle cx="990" cy="190" r="4"/>
      <circle cx="1130" cy="150" r="5" fill="#8A2BE2"/>
      <circle cx="760" cy="215" r="3" fill-opacity="0.6"/>
      <circle cx="1080" cy="235" r="3" fill-opacity="0.6"/>
    </g>

    <!-- Un seul mouvement : deux paquets qui circulent dans le réseau -->
    <circle r="9" fill="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion>
    </circle>
    <circle r="9" fill="url(#glow)">
      <animateMotion dur="7.5s" begin="1.5s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion>
    </circle>

    <!-- Texte -->
    <text x="64" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#F0F6FC" letter-spacing="0.5">Issa Ibrahim Moubarak</text>
    <rect x="66" y="132" width="120" height="4" rx="2" fill="url(#bar)"/>
    <text x="64" y="176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C9D1D9">AI Engineer, Data Scientist, Software Engineer</text>
    <text x="64" y="208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8B949E">DevOps et MLOps pour les plateformes Data &amp; IA, Niamey</text>
  </g>
</svg>
